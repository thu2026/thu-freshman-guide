<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>自动创建 Gitee 仓库</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; margin: 0; }
  .card { background: white; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.1); max-width: 500px; }
  h2 { color: #0d6b35; margin-bottom: 8px; }
  .sub { color: #999; font-size: 14px; margin-bottom: 24px; }
  .btn { display: inline-block; padding: 14px 40px; background: #0d6b35; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; text-decoration: none; }
  .btn:hover { background: #0a5a2c; }
  .info { background: #fffbe6; border-left: 4px solid #f5a623; padding: 14px; margin: 20px 0; text-align: left; font-size: 13px; color: #6d5e00; border-radius: 0 10px 10px 0; }
  .step { text-align: left; margin: 16px 0; }
  .step span { display: inline-block; width: 24px; height: 24px; background: #0d6b35; color: white; border-radius: 50%; text-align: center; line-height: 24px; font-size: 12px; margin-right: 8px; }
</style>
</head>
<body>
<div class="card">
  <h2>🚀 一键创建仓库</h2>
  <p class="sub">仓库名：<strong>thu-freshman-guide</strong> · 公开 · 无锡太湖学院2026届新生全攻略</p>

  <div class="info">
    ⚠️ 请确保你已在浏览器中<strong>登录 Gitee</strong>（账号 13173049383）<br>
    提交后如果看到 Gitee 首页即表示创建成功！
  </div>

  <div class="step">
    <span>1</span> 确认已登录 <a href="https://gitee.com" target="_blank">gitee.com</a>
  </div>
  <div class="step">
    <span>2</span> 点击下方按钮 → 自动创建仓库
  </div>

  <form id="createForm" action="https://gitee.com/projects" method="POST" target="_blank">
    <input type="hidden" name="project[name]" value="thu-freshman-guide">
    <input type="hidden" name="project[description]" value="无锡太湖学院2026届新生全攻略">
    <input type="hidden" name="project[private]" value="0">
    <input type="hidden" name="project[path]" value="thu-freshman-guide">
    <input type="hidden" name="project[default_branch]" value="main">
    <button type="submit" class="btn">📦 创建仓库</button>
  </form>

  <p style="margin-top:16px;font-size:12px;color:#aaa;">创建成功后告诉我，我立即推送全部代码</p>
</div>
</body>
</html>
